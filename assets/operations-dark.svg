<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif"><title>From a fresh card to a monitored device, and how releases reach it</title><defs><marker id="h-arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#768390"/></marker><marker id="h-server" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8f94fb"/></marker><marker id="h-pi" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#e17ff0"/></marker><marker id="h-amber" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#f0a742"/></marker><marker id="h-red" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#f0805a"/></marker><marker id="h-ok" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#3fb98a"/></marker></defs><rect width="1200" height="560" rx="16" fill="#0d1117" stroke="#3d444d"/><text x="40" y="54" font-size="26" font-weight="700" fill="#e6edf3" text-anchor="start">Life of a device</text><text x="40" y="82" font-size="15" font-weight="400" fill="#9198a1" text-anchor="start">In October 2026 I combined provisioning and verification into one resumable bench command.</text><path d="M860 50 H894" fill="none" stroke="#e17ff0" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><text x="904" y="55" font-size="13" font-weight="400" fill="#9198a1" text-anchor="start">on the device</text><path d="M1006.3 50 H1040.3" fill="none" stroke="#8f94fb" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><text x="1050.3" y="55" font-size="13" font-weight="400" fill="#9198a1" text-anchor="start">operations</text><rect x="40" y="112" width="204" height="122" rx="12" fill="#1c2129" stroke="#3d444d" stroke-width="1.2"/><rect x="40" y="124" width="4" height="98" rx="2" fill="#e17ff0"/><circle cx="72" cy="141" r="13" fill="#e17ff0"/><text x="72" y="146" font-size="13" font-weight="700" fill="#0d1117" text-anchor="middle">1</text><text x="94" y="146" font-size="16" font-weight="650" fill="#e6edf3" text-anchor="start">Bench setup</text><text x="60" y="174" font-size="14" font-weight="400" fill="#9198a1" text-anchor="start">Run the full command</text><text x="60" y="194" font-size="14" font-weight="400" fill="#9198a1" text-anchor="start">or stop at prepared</text><text x="60" y="214" font-size="14" font-weight="400" fill="#9198a1" text-anchor="start">or deferred.</text><path d="M249 173 H267" fill="none" stroke="#768390" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#h-arrow)"/><rect x="274" y="112" width="204" height="122" rx="12" fill="#1c2129" stroke="#3d444d" stroke-width="1.2"/><rect x="274" y="124" width="4" height="98" rx="2" fill="#e17ff0"/><circle cx="306" cy="141" r="13" fill="#e17ff0"/><text x="306" y="146" font-size="13" font-weight="700" fill="#0d1117" text-anchor="middle">2</text><text x="328" y="146" font-size="16" font-weight="650" fill="#e6edf3" text-anchor="start">Platform check</text><text x="294" y="174" font-size="14" font-weight="400" fill="#9198a1" text-anchor="start">On a full run, check</text><text x="294" y="194" font-size="14" font-weight="400" fill="#9198a1" text-anchor="start">the device’s credential</text><text x="294" y="214" font-size="14" font-weight="400" fill="#9198a1" text-anchor="start">before registration.</text><path d="M483 173 H501" fill="none" stroke="#768390" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#h-arrow)"/><rect x="508" y="112" width="204" height="122" rx="12" fill="#1c2129" stroke="#3d444d" stroke-width="1.2"/><rect x="508" y="124" width="4" height="98" rx="2" fill="#8f94fb"/><circle cx="540" cy="141" r="13" fill="#8f94fb"/><text x="540" y="146" font-size="13" font-weight="700" fill="#0d1117" text-anchor="middle">3</text><text x="562" y="146" font-size="16" font-weight="650" fill="#e6edf3" text-anchor="start">Registration</text><text x="528" y="174" font-size="14" font-weight="400" fill="#9198a1" text-anchor="start">A pending registry entry</text><text x="528" y="194" font-size="14" font-weight="400" fill="#9198a1" text-anchor="start">does not arm device</text><text x="528" y="214" font-size="14" font-weight="400" fill="#9198a1" text-anchor="start">paging.</text><path d="M717 173 H735" fill="none" stroke="#768390" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#h-arrow)"/><rect x="742" y="112" width="204" height="122" rx="12" fill="#1c2129" stroke="#3d444d" stroke-width="1.2"/><rect x="742" y="124" width="4" height="98" rx="2" fill="#e17ff0"/><circle cx="774" cy="141" r="13" fill="#e17ff0"/><text x="774" y="146" font-size="13" font-weight="700" fill="#0d1117" text-anchor="middle">4</text><text x="796" y="146" font-size="16" font-weight="650" fill="#e6edf3" text-anchor="start">Software handoff</text><text x="762" y="174" font-size="14" font-weight="400" fill="#9198a1" text-anchor="start">READY or findings</text><text x="762" y="194" font-size="14" font-weight="400" fill="#9198a1" text-anchor="start">Then verify both</text><text x="762" y="214" font-size="14" font-weight="400" fill="#9198a1" text-anchor="start">directions on site.</text><path d="M951 173 H969" fill="none" stroke="#768390" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#h-arrow)"/><rect x="976" y="112" width="204" height="122" rx="12" fill="#1c2129" stroke="#3d444d" stroke-width="1.2"/><rect x="976" y="124" width="4" height="98" rx="2" fill="#8f94fb"/><circle cx="1008" cy="141" r="13" fill="#8f94fb"/><text x="1008" y="146" font-size="13" font-weight="700" fill="#0d1117" text-anchor="middle">5</text><text x="1030" y="146" font-size="16" font-weight="650" fill="#e6edf3" text-anchor="start">Device paging</text><text x="996" y="174" font-size="14" font-weight="400" fill="#9198a1" text-anchor="start">Arm after activation</text><text x="996" y="194" font-size="14" font-weight="400" fill="#9198a1" text-anchor="start">and burn-in, using</text><text x="996" y="214" font-size="14" font-weight="400" fill="#9198a1" text-anchor="start">venue hours.</text><text x="40" y="296" font-size="16" font-weight="650" fill="#e6edf3" text-anchor="start">Every release since late June 2026</text><rect x="40" y="316" width="204" height="126" rx="12" fill="#1c2129" stroke="#3d444d" stroke-width="1.2"/><rect x="40" y="328" width="4" height="102" rx="2" fill="#8f94fb"/><text x="60" y="350" font-size="16" font-weight="650" fill="#e6edf3" text-anchor="start">Exact tag</text><text x="60" y="378" font-size="13" font-weight="400" fill="#9198a1" text-anchor="start">Transfer a verified bundle</text><text x="60" y="398" font-size="13" font-weight="400" fill="#9198a1" text-anchor="start">from the operator machine.</text><path d="M249 377 H267" fill="none" stroke="#768390" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#h-arrow)"/><rect x="274" y="316" width="204" height="126" rx="12" fill="#1c2129" stroke="#3d444d" stroke-width="1.2"/><rect x="274" y="328" width="4" height="102" rx="2" fill="#e17ff0"/><text x="294" y="350" font-size="16" font-weight="650" fill="#e6edf3" text-anchor="start">Environment</text><text x="294" y="378" font-size="13" font-weight="400" fill="#9198a1" text-anchor="start">Reuse a healthy match or</text><text x="294" y="398" font-size="13" font-weight="400" fill="#9198a1" text-anchor="start">prepare a hash-pinned</text><text x="294" y="418" font-size="13" font-weight="400" fill="#9198a1" text-anchor="start">candidate.</text><path d="M483 377 H501" fill="none" stroke="#768390" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#h-arrow)"/><rect x="508" y="316" width="204" height="126" rx="12" fill="#1c2129" stroke="#3d444d" stroke-width="1.2"/><rect x="508" y="328" width="4" height="102" rx="2" fill="#e17ff0"/><text x="528" y="350" font-size="16" font-weight="650" fill="#e6edf3" text-anchor="start">Pre-switch checks</text><text x="528" y="378" font-size="13" font-weight="400" fill="#9198a1" text-anchor="start">Check runtime and display.</text><text x="528" y="398" font-size="13" font-weight="400" fill="#9198a1" text-anchor="start">A failed check can leave</text><text x="528" y="418" font-size="13" font-weight="400" fill="#9198a1" text-anchor="start">the live environment intact.</text><path d="M717 377 H735" fill="none" stroke="#768390" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#h-arrow)"/><rect x="742" y="316" width="204" height="126" rx="12" fill="#1c2129" stroke="#3d444d" stroke-width="1.2"/><rect x="742" y="328" width="4" height="102" rx="2" fill="#3fb98a"/><text x="762" y="350" font-size="16" font-weight="650" fill="#e6edf3" text-anchor="start">Activate and verify</text><text x="762" y="369" font-size="16" font-weight="650" fill="#e6edf3" text-anchor="start">service</text><text x="762" y="397" font-size="13" font-weight="400" fill="#9198a1" text-anchor="start">Restart in the kiosk session.</text><text x="762" y="417" font-size="13" font-weight="400" fill="#9198a1" text-anchor="start">Check enabled and active.</text><rect x="976" y="316" width="204" height="126" rx="12" fill="#1c2129" stroke="#3d444d" stroke-width="1.2"/><rect x="976" y="328" width="4" height="102" rx="2" fill="#f0805a"/><text x="996" y="350" font-size="16" font-weight="650" fill="#e6edf3" text-anchor="start">Recover or redeploy</text><text x="996" y="369" font-size="16" font-weight="650" fill="#e6edf3" text-anchor="start">known-good tag</text><text x="996" y="397" font-size="13" font-weight="400" fill="#9198a1" text-anchor="start">Attempt recovery. Operator</text><text x="996" y="417" font-size="13" font-weight="400" fill="#9198a1" text-anchor="start">selects the rollback tag.</text><path d="M844.0 446 V478 H1078.0 V446" fill="none" stroke="#f0805a" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 4" marker-end="url(#h-red)"/><text x="960" y="501" font-size="13" font-weight="400" fill="#f0805a" text-anchor="middle">If post-restart verification fails</text><text x="40" y="528" font-size="13.5" font-weight="400" fill="#9198a1" text-anchor="start">System package updates are a separate maintenance step.</text></svg>
