<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="372" viewBox="0 0 1200 372" role="img" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif"><title>Releases from May to October 2026</title><defs><marker id="h-arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#768390"/></marker><marker id="h-server" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8f94fb"/></marker><marker id="h-pi" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#e17ff0"/></marker><marker id="h-amber" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#f0a742"/></marker><marker id="h-red" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#f0805a"/></marker><marker id="h-ok" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#3fb98a"/></marker></defs><rect width="1200" height="372" rx="16" fill="#0d1117" stroke="#3d444d"/><text x="40" y="54" font-size="26" font-weight="700" fill="#e6edf3" text-anchor="start">Releases in the field</text><text x="40" y="82" font-size="15" font-weight="400" fill="#9198a1" text-anchor="start">Twenty stable releases from May to October 2026. I delivered field updates remotely.</text><path d="M70 214 H1150" fill="none" stroke="#3d444d" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M70.0 208 V220" fill="none" stroke="#3d444d" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><text x="78.0" y="238" font-size="13.5" font-weight="400" fill="#9198a1" text-anchor="start">May 2026</text><path d="M224.28571428571428 208 V220" fill="none" stroke="#3d444d" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><text x="232.28571428571428" y="238" font-size="13.5" font-weight="400" fill="#9198a1" text-anchor="start">Jun</text><path d="M378.57142857142856 208 V220" fill="none" stroke="#3d444d" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><text x="386.57142857142856" y="238" font-size="13.5" font-weight="400" fill="#9198a1" text-anchor="start">Jul</text><path d="M532.8571428571429 208 V220" fill="none" stroke="#3d444d" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><text x="540.8571428571429" y="238" font-size="13.5" font-weight="400" fill="#9198a1" text-anchor="start">Aug</text><path d="M687.1428571428571 208 V220" fill="none" stroke="#3d444d" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><text x="695.1428571428571" y="238" font-size="13.5" font-weight="400" fill="#9198a1" text-anchor="start">Sep</text><path d="M841.4285714285713 208 V220" fill="none" stroke="#3d444d" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><text x="849.4285714285713" y="238" font-size="13.5" font-weight="400" fill="#9198a1" text-anchor="start">Oct</text><path d="M995.7142857142857 208 V220" fill="none" stroke="#3d444d" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><text x="1003.7142857142857" y="238" font-size="13.5" font-weight="400" fill="#9198a1" text-anchor="start">Nov</text><path d="M97.8 174 V205" fill="none" stroke="#e17ff0" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="3 3"/><rect x="87.77142857142857" y="118" width="262" height="56" rx="10" fill="#1c2129" stroke="#3d444d" stroke-width="1.2"/><rect x="87.77142857142857" y="128" width="4" height="36" rx="2" fill="#e17ff0"/><text x="103.77142857142857" y="141" font-size="13.5" font-weight="650" fill="#e6edf3" text-anchor="start">v1.0–1.1 · first stable releases</text><text x="103.77142857142857" y="161" font-size="12.5" font-weight="400" fill="#9198a1" text-anchor="start">landscape, then portrait kiosk</text><path d="M286.0 223 V262" fill="none" stroke="#8f94fb" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="3 3"/><rect x="276.0" y="262" width="262" height="56" rx="10" fill="#1c2129" stroke="#3d444d" stroke-width="1.2"/><rect x="276.0" y="272" width="4" height="36" rx="2" fill="#8f94fb"/><text x="292.0" y="285" font-size="13.5" font-weight="650" fill="#e6edf3" text-anchor="start">v1.2–1.3 · ready for the field</text><text x="292.0" y="305" font-size="12.5" font-weight="400" fill="#9198a1" text-anchor="start">health checks; bundle provisioning</text><path d="M394.0 174 V205" fill="none" stroke="#e17ff0" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="3 3"/><rect x="384.0" y="118" width="262" height="56" rx="10" fill="#1c2129" stroke="#3d444d" stroke-width="1.2"/><rect x="384.0" y="128" width="4" height="36" rx="2" fill="#e17ff0"/><text x="400.0" y="141" font-size="13.5" font-weight="650" fill="#e6edf3" text-anchor="start">v1.4–1.5 · resilience, new hardware</text><text x="400.0" y="161" font-size="12.5" font-weight="400" fill="#9198a1" text-anchor="start">reconnects; single-pin turnstiles</text><path d="M605.4 223 V262" fill="none" stroke="#e17ff0" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="3 3"/><rect x="595.3714285714286" y="262" width="262" height="56" rx="10" fill="#1c2129" stroke="#3d444d" stroke-width="1.2"/><rect x="595.3714285714286" y="272" width="4" height="36" rx="2" fill="#e17ff0"/><text x="611.3714285714286" y="285" font-size="13.5" font-weight="650" fill="#e6edf3" text-anchor="start">v1.6–1.8 · card access, live screen</text><text x="611.3714285714286" y="305" font-size="12.5" font-weight="400" fill="#9198a1" text-anchor="start">entry and exit aware; relay profile</text><path d="M779.7 174 V205" fill="none" stroke="#f0805a" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="3 3"/><rect x="769.7142857142857" y="118" width="262" height="56" rx="10" fill="#1c2129" stroke="#3d444d" stroke-width="1.2"/><rect x="769.7142857142857" y="128" width="4" height="36" rx="2" fill="#f0805a"/><text x="785.7142857142857" y="141" font-size="13.5" font-weight="650" fill="#e6edf3" text-anchor="start">19 Sep · ten-hour connectivity loss</text><text x="785.7142857142857" y="161" font-size="12.5" font-weight="400" fill="#9198a1" text-anchor="start">Eight devices entered offline free-pass.</text><path d="M880.0 223 V262" fill="none" stroke="#8f94fb" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="3 3"/><rect x="870.0" y="262" width="262" height="56" rx="10" fill="#1c2129" stroke="#3d444d" stroke-width="1.2"/><rect x="870.0" y="272" width="4" height="36" rx="2" fill="#8f94fb"/><text x="886.0" y="285" font-size="13.5" font-weight="650" fill="#e6edf3" text-anchor="start">v1.9–1.11 · a watched fleet</text><text x="886.0" y="305" font-size="12.5" font-weight="400" fill="#9198a1" text-anchor="start">alerting, one-command setup, staff panel</text><circle cx="97.8" cy="214" r="6.5" fill="#e17ff0" stroke="#e17ff0" stroke-width="2"/><circle cx="102.4" cy="214" r="4" fill="#0d1117" stroke="#e17ff0" stroke-width="2"/><circle cx="286.0" cy="214" r="6.5" fill="#e17ff0" stroke="#e17ff0" stroke-width="2"/><circle cx="347.7" cy="214" r="6.5" fill="#e17ff0" stroke="#e17ff0" stroke-width="2"/><circle cx="358.5" cy="214" r="4" fill="#0d1117" stroke="#e17ff0" stroke-width="2"/><circle cx="394.0" cy="214" r="6.5" fill="#e17ff0" stroke="#e17ff0" stroke-width="2"/><circle cx="404.8" cy="214" r="4" fill="#0d1117" stroke="#e17ff0" stroke-width="2"/><circle cx="444.9" cy="214" r="6.5" fill="#e17ff0" stroke="#e17ff0" stroke-width="2"/><circle cx="448.0" cy="214" r="4" fill="#0d1117" stroke="#e17ff0" stroke-width="2"/><circle cx="451.1" cy="