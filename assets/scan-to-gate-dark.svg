<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif"><title>From QR scan to controller output and offline free-pass during a sustained disconnect</title><defs><marker id="h-arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#768390"/></marker><marker id="h-server" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8f94fb"/></marker><marker id="h-pi" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#e17ff0"/></marker><marker id="h-amber" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#f0a742"/></marker><marker id="h-red" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#f0805a"/></marker><marker id="h-ok" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#3fb98a"/></marker></defs><rect width="1200" height="640" rx="16" fill="#0d1117" stroke="#3d444d"/><text x="40" y="54" font-size="26" font-weight="700" fill="#e6edf3" text-anchor="start">From QR scan to controller output</text><text x="40" y="82" font-size="15" font-weight="400" fill="#9198a1" text-anchor="start">The partner platform authorizes individual member access. The device resolves the grant’s direction before requesting a pulse.</text><path d="M742 50 H776" fill="none" stroke="#f0a742" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><text x="786" y="55" font-size="13" font-weight="400" fill="#9198a1" text-anchor="start">platform</text><path d="M852.8 50 H886.8" fill="none" stroke="#e17ff0" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><text x="896.8" y="55" font-size="13" font-weight="400" fill="#9198a1" text-anchor="start">device agent</text><path d="M992.0 50 H1026.0" fill="none" stroke="#3fb98a" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><text x="1036.0" y="55" font-size="13" font-weight="400" fill="#9198a1" text-anchor="start">controller</text><rect x="40" y="112" width="204" height="122" rx="12" fill="#1c2129" stroke="#3d444d" stroke-width="1.2"/><rect x="40" y="124" width="4" height="98" rx="2" fill="#e17ff0"/><text x="60" y="146" font-size="16" font-weight="650" fill="#e6edf3" text-anchor="start">A fresh QR</text><text x="60" y="174" font-size="14" font-weight="400" fill="#9198a1" text-anchor="start">The Pi requests and</text><text x="60" y="194" font-size="14" font-weight="400" fill="#9198a1" text-anchor="start">refreshes the QR over</text><text x="60" y="214" font-size="14" font-weight="400" fill="#9198a1" text-anchor="start">its own connection.</text><path d="M249 173 H267" fill="none" stroke="#768390" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#h-arrow)"/><rect x="274" y="112" width="204" height="122" rx="12" fill="#1c2129" stroke="#3d444d" stroke-width="1.2"/><rect x="274" y="124" width="4" height="98" rx="2" fill="#f0a742"/><text x="294" y="146" font-size="16" font-weight="650" fill="#e6edf3" text-anchor="start">Member scans</text><text x="294" y="174" font-size="14" font-weight="400" fill="#9198a1" text-anchor="start">The member scans the</text><text x="294" y="194" font-size="14" font-weight="400" fill="#9198a1" text-anchor="start">QR in the platform’s</text><text x="294" y="214" font-size="14" font-weight="400" fill="#9198a1" text-anchor="start">mobile app.</text><path d="M483 173 H501" fill="none" stroke="#768390" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#h-arrow)"/><rect x="508" y="112" width="204" height="122" rx="12" fill="#1c2129" stroke="#3d444d" stroke-width="1.2"/><rect x="508" y="124" width="4" height="98" rx="2" fill="#f0a742"/><text x="528" y="146" font-size="16" font-weight="650" fill="#e6edf3" text-anchor="start">Platform decides</text><text x="528" y="174" font-size="14" font-weight="400" fill="#9198a1" text-anchor="start">The platform checks its</text><text x="528" y="194" font-size="14" font-weight="400" fill="#9198a1" text-anchor="start">membership rules and</text><text x="528" y="214" font-size="14" font-weight="400" fill="#9198a1" text-anchor="start">sends an access grant.</text><path d="M717 173 H735" fill="none" stroke="#768390" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#h-arrow)"/><rect x="742" y="112" width="204" height="122" rx="12" fill="#1c2129" stroke="#3d444d" stroke-width="1.2"/><rect x="742" y="124" width="4" height="98" rx="2" fill="#e17ff0"/><text x="762" y="146" font-size="16" font-weight="650" fill="#e6edf3" text-anchor="start">Validate grant</text><text x="762" y="174" font-size="14" font-weight="400" fill="#9198a1" text-anchor="start">Resolve entry or exit.</text><text x="762" y="194" font-size="14" font-weight="400" fill="#9198a1" text-anchor="start">After a grant, request</text><text x="762" y="214" font-size="14" font-weight="400" fill="#9198a1" text-anchor="start">the next QR.</text><path d="M951 173 H969" fill="none" stroke="#768390" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#h-arrow)"/><rect x="976" y="112" width="204" height="122" rx="12" fill="#1c2129" stroke="#3d444d" stroke-width="1.2"/><rect x="976" y="124" width="4" height="98" rx="2" fill="#3fb98a"/><text x="996" y="146" font-size="16" font-weight="650" fill="#e6edf3" text-anchor="start">Controller signalled</text><text x="996" y="174" font-size="14" font-weight="400" fill="#9198a1" text-anchor="start">For a new pulse, signal</text><text x="996" y="194" font-size="14" font-weight="400" fill="#9198a1" text-anchor="start">the controller and show</text><text x="996" y="214" font-size="14" font-weight="400" fill="#9198a1" text-anchor="start">available member details.</text><text x="40" y="300" font-size="16" font-weight="650" fill="#e6edf3" text-anchor="start">When the link to the platform drops</text><rect x="40" y="330" width="182" height="70" rx="8" fill="#2c1530" stroke="#2c1530" stroke-width="1.2"/><text x="54" y="356" font-size="14" font-weight="650" fill="#e17ff0" text-anchor="start">QR on screen</text><text x="54" y="378" font-size="12.5" font-weight="400" fill="#9198a1" text-anchor="start">Connected</text><rect x="222" y="330" width="181" height="70" rx="8" fill="#2c1530" stroke="#2c1530" stroke-width="1.2"/><text x="236" y="356" font-size="14" font-weight="650" fill="#e17ff0" text-anchor="start">Brief drop</text><text x="236" y="378" font-size="12.5" font-weight="400" fill="#9198a1" text-anchor="start">No notice yet</text><rect x="403" y="330" width="289" height="70" rx="8" fill="#2d2010" stroke="#2d2010" stroke-width="1.2"/><text x="417" y="356" font-size="14" font-weight="650" fill="#f0a742" text-anchor="start">Connecting notice</text><text x="417" y="378" font-size="12.5" font-weight="400" fill="#9198a1" text-anchor="start">Retries at 1 s intervals by default</text><rect x="692" y="330" width="218" height="70" rx="8" fill="#102a20" stroke="#102a20" stroke-width="1.2"/><text x="706" y="356" font-size="14" font-weight="650" fill="#3fb98a" text-anchor="start">Offline free-pass</text><text x="706" y="378" font-size="12.5" font-weight="400" fill="#9198a1" text-anchor="start">Staff see “offline mode”</text><rect x="910" y="330" width="250" height="70" rx="8" fill="#2c1530" stroke="#2c1530" stroke-width="1.2"/><text x="924" y="356" font-size="14" font-weight="650" fill="#e17ff0" text-anchor="start">Offline request cleared</text><text x="924" y="378" font-size="12.5" font-weight="400" fill="#9198a1" text-anchor="start">Other free-mode requests can remain</text><path d="M222 322 V408" fill="none" stroke="#f0805a" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 4"/><text x="222" y="426" font-size="13" font-weight="400" fill="#9198a1" text-anchor="middle">link lost</text><path d="M692 322 V408" fill="none" stroke="#f0a742" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 4"/><text x="692" y="426" font-size="13" font-weight="400" fill="#9198a1" text-anchor="middle">grace period ends</text><path d="M910 322 V408" fill="none" stroke="#3fb98a" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 4"/><text x="910" y="426" font-size="13" font-weight="400" fill="#9198a1" text-anchor="middle">stable connection restored</text><text x="40" y="470" font-size="16" font-weight="650" fill="#e6edf3" text-anchor="start">How the agent handles each request</text><rect x="40" y="490" width="360" height="120" rx="12" fill="#1c2129" stroke="#3d444d" stroke-width="1.2"/><rect x="40" y="502" width="4" height="96" rx="2" fill="#f0a742"/><text x="60" y="524" font-size="16" font-weight="650" fill="#e6edf3" text-anchor="start">Member access</text><text x="60" y="552" font-size="13.5" font-weight="400" fill="#9198a1" text-anchor="start">Only online member approvals depend on the</text><text x="60" y="572" font-size="13.5" font-weight="400" fill="#9198a1" text-anchor="start">partner platform. Staff can request free</text><text x="60" y="592" font-size="13.5" font-weight="400" fill="#9198a1" text-anchor="start">mode locally.</text><rect x="420" y="490" width="360" height="120" rx="12" fill="#1c2129" stroke="#3d444d" stroke-width="1.2"/><rect x="420" y="502" width="4" height="96" rx="2" fill="#e17ff0"/><text x="440" y="524" font-size="16" font-weight="650" fill="#e6edf3" text-anchor="start">Overlapping grants</text><text x="440" y="552" font-size="13.5" font-weight="400" fill="#9198a1" text-anchor="start">A same-direction grant can extend an active</text><text x="440" y="572" font-size="13.5" font-weight="400" fill="#9198a1" text-anchor="start">pulse. The agent logs and ignores an</text><text x="440" y="592" font-size="13.5" font-weight="400" fill="#9198a1" text-anchor="start">opposing grant.</text><rect x="800" y="490" width="360" height="120" rx="12" fill="#1c2129" stroke="#3d444d" stroke-width="1.2"/><rect x="800" y="502" width="4" height="96" rx="2" fill="#3fb98a"/><text x="820" y="524" font-size="16" font-weight="650" fill="#e6edf3" text-anchor="start">Offline free-pass</text><text x="820" y="552" font-size="13.5" font-weight="400" fill="#9198a1" text-anchor="start">A sustained disconnect triggers free passage.</text><text x="820" y="572" font-size="13.5" font-weight="400" fill="#9198a1" text-anchor="start">A stable reconnection clears the offline</text><text x="820" y="592" font-size="13.5" font-weight="400" fill="#9198a1" text-anchor="start">request independently of staff or platform mode.</text></svg>
