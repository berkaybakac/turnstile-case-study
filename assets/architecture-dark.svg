<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif"><title>Architecture of the turnstile device agent and its fleet operations</title><defs><marker id="h-arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#768390"/></marker><marker id="h-server" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8f94fb"/></marker><marker id="h-pi" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#e17ff0"/></marker><marker id="h-amber" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#f0a742"/></marker><marker id="h-red" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#f0805a"/></marker><marker id="h-ok" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#3fb98a"/></marker></defs><rect width="1200" height="760" rx="16" fill="#0d1117" stroke="#3d444d"/><text x="40" y="54" font-size="26" font-weight="700" fill="#e6edf3" text-anchor="start">Where everything runs</text><text x="40" y="82" font-size="15" font-weight="400" fill="#9198a1" text-anchor="start">One Raspberry Pi per turnstile. The platform link and telemetry start at the device; the collector never commands it.</text><rect x="24" y="104" width="600" height="600" rx="16" fill="#151b23" stroke="#3d444d" stroke-width="1.2" stroke-dasharray="6 5"/><rect x="648" y="104" width="528" height="270" rx="16" fill="#151b23" stroke="#3d444d" stroke-width="1.2" stroke-dasharray="6 5"/><rect x="648" y="398" width="528" height="306" rx="16" fill="#151b23" stroke="#3d444d" stroke-width="1.2" stroke-dasharray="6 5"/><text x="44" y="132" font-size="12.5" font-weight="700" fill="#9198a1" text-anchor="start" letter-spacing="1">CUSTOMER SITE · ONE PI PER TURNSTILE</text><text x="668" y="132" font-size="12.5" font-weight="700" fill="#9198a1" text-anchor="start" letter-spacing="1">PARTNER ACCESS PLATFORM</text><text x="668" y="426" font-size="12.5" font-weight="700" fill="#9198a1" text-anchor="start" letter-spacing="1">OPERATIONS · COMPANY CLOUD</text><rect x="48" y="152" width="552" height="300" rx="12" fill="#1c2129" stroke="#3d444d" stroke-width="1.2"/><rect x="48" y="164" width="4" height="276" rx="2" fill="#e17ff0"/><text x="68" y="186" font-size="16" font-weight="650" fill="#e6edf3" text-anchor="start">Device agent · Raspberry Pi 3</text><text x="68" y="214" font-size="13.5" font-weight="400" fill="#9198a1" text-anchor="start">Python, asyncio · systemd user service in the kiosk session</text><rect x="70" y="220" width="508" height="36" rx="8" fill="#2c1530" stroke="#2c1530" stroke-width="1.2"/><text x="86" y="243" font-size="14" font-weight="400" fill="#e6edf3" text-anchor="start">Protocol adapter · resolves grant direction</text><rect x="70" y="264" width="508" height="36" rx="8" fill="#2c1530" stroke="#2c1530" stroke-width="1.2"/><text x="86" y="287" font-size="14" font-weight="400" fill="#e6edf3" text-anchor="start">Runtime: connection, QR lifecycle, offline policy</text><rect x="70" y="308" width="508" height="36" rx="8" fill="#2c1530" stroke="#2c1530" stroke-width="1.2"/><text x="86" y="331" font-size="14" font-weight="400" fill="#e6edf3" text-anchor="start">Kiosk display: local web UI in Chromium</text><rect x="70" y="352" width="508" height="36" rx="8" fill="#2c1530" stroke="#2c1530" stroke-width="1.2"/><text x="86" y="375" font-size="14" font-weight="400" fill="#e6edf3" text-anchor="start">Output port: Field GPIO · serial implementation</text><rect x="70" y="396" width="508" height="36" rx="8" fill="#2c1530" stroke="#2c1530" stroke-width="1.2"/><text x="86" y="419" font-size="14" font-weight="400" fill="#e6edf3" text-anchor="start">Health, safe audit log, one-way reporter</text><rect x="48" y="488" width="260" height="96" rx="12" fill="#1c2129" stroke="#3d444d" stroke-width="1.2"/><rect x="48" y="500" width="4" height="72" rx="2" fill="#3fb98a"/><text x="68" y="522" font-size="16" font-weight="650" fill="#e6edf3" text-anchor="start">Turnstile</text><text x="68" y="550" font-size="14" font-weight="400" fill="#9198a1" text-anchor="start">entry · exit · free pass</text><rect x="340" y="488" width="260" height="96" rx="12" fill="#1c2129" stroke="#3d444d" stroke-width="1.2"/><rect x="340" y="500" width="4" height="72" rx="2" fill="#9198a1"/><text x="360" y="522" font-size="16" font-weight="650" fill="#e6edf3" text-anchor="start">Touch or HDMI display</text><text x="360" y="550" font-size="14" font-weight="400" fill="#9198a1" text-anchor="start">QR, greeting, staff panel</text><rect x="48" y="604" width="552" height="76" rx="12" fill="#1c2129" stroke="#3d444d" stroke-width="1.2"/><rect x="48" y="616" width="4" height="52" rx="2" fill="#9198a1"/><text x="68" y="638" font-size="16" font-weight="650" fill="#e6edf3" text-anchor="start">USB card reader (optional)</text><text x="68" y="666" font-size="13" font-weight="400" fill="#9198a1" text-anchor="start">Sends a card code to the agent for a platform access request.</text><path d="M324 602 V456" fill="none" stroke="#e17ff0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#h-pi)"/><path d="M178 458 V482" fill="none" stroke="#3fb98a" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#h-ok)"/><path d="M470 458 V482" fill="none" stroke="#768390" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#h-arrow)" marker-start="url(#h-arrow)"/><rect x="672" y="152" width="480" height="196" rx="12" fill="#1c2129" stroke="#3d444d" stroke-width="1.2"/><rect x="672" y="164" width="4" height="172" rx="2" fill="#f0a742"/><text x="692" y="186" font-size="16" font-weight="650" fill="#e6edf3" text-anchor="start">Access platform (third party)</text><text x="692" y="214" font-size="14" font-weight="400" fill="#9198a1" text-anchor="start">members, packages, mobile app,</text><text x="692" y="234" font-size="14" font-weight="400" fill="#9198a1" text-anchor="start">access decisions</text><path d="M600 232 H666" fill="none" stroke="#f0a742" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#h-amber)" marker-start="url(#h-amber)"/><text x="634" y="222" font-size="12.5" font-weight="400" fill="#f0a742" text-anchor="middle">WSS</text><text x="692" y="262" font-size="13" font-weight="400" fill="#9198a1" text-anchor="start">Device-initiated, authenticated per device;</text><text x="692" y="281" font-size="13" font-weight="400" fill="#9198a1" text-anchor="start">QR requests, access grants, free and</text><text x="692" y="300" font-size="13" font-weight="400" fill="#9198a1" text-anchor="start">maintenance modes.</text><rect x="672" y="446" width="215" height="112" rx="12" fill="#1c2129" stroke="#3d444d" stroke-width="1.2"/><rect x="672" y="458" width="4" height="88" rx="2" fill="#8f94fb"/><text x="692" y="480" font-size="16" font-weight="650" fill="#e6edf3" text-anchor="start">Collector</text><text x="692" y="508" font-size="13" font-weight="400" fill="#9198a1" text-anchor="start">Heartbeats, logs, device registry</text><text x="692" y="528" font-size="13" font-weight="400" fill="#9198a1" text-anchor="start">Alarm eligibility and metrics</text><rect x="953" y="446" width="199" height="112" rx="12" fill="#1c2129" stroke="#3d444d" stroke-width="1.2"/><rect x="953" y="458" width="4" height="88" rx="2" fill="#8f94fb"/><text x="973" y="480" font-size="16" font-weight="650" fill="#e6edf3" text-anchor="start">Prometheus</text><text x="973" y="508" font-size="13" font-weight="400" fill="#9198a1" text-anchor="start">Scrapes metrics</text><text x="973" y="528" font-size="13" font-weight="400" fill="#9198a1" text-anchor="start">Evaluates alert rules</text><rect x="672" y="590" width="215" height="90" rx="12" fill="#1c2129" stroke="#3d444d" stroke-width="1.2"/><rect x="672" y="602" width="4" height="66" rx="2" fill="#8f94fb"/><text x="692" y="624" font-size="16" font-weight="650" fill="#e6edf3" text-anchor="start">Alertmanager</text><text x="692" y="652" font-size="13" font-weight="400" fill="#9198a1" text-anchor="start">Sends alerts to Telegram</text><rect x="953" y="590" width="199" height="90" rx="12" fill="#1c2129" stroke="#3d444d" stroke-width="1.2"/><rect x="953" y="602" width="4" height="66" rx="2" fill="#8f94fb"/><text x="973" y="624" font-size="16" font-weight="650" fill="#e6edf3" text-anchor="start">Grafana</text><text x="973" y="652" font-size="13" font-weight="400" fill="#9198a1" text-anchor="start">Queries fleet metrics</text><path d="M600 410 H636 V500 H666" fill="none" stroke="#8f94fb" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#h-server)"/><text x="612" y="398" font-size="12.5" font-weight="400" fill="#8f94fb" text-anchor="start">push</text><path d="M949 505 H892" fill="none" stroke="#8f94fb" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#h-server)"/><text x="920" y="492" font-size="12.5" font-weight="400" fill="#8f94fb" text-anchor="middle">scrape</text><path d="M988 560 V574 H780 V585" fill="none" stroke="#8f94fb" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#h-server)"/><path d="M1054 587 V563" fill="none" stroke="#8f94fb" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#h-server)"/><path d="M40 734 H74" fill="none" stroke="#f0a742" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><text x="84" y="739" font-size="13" font-weight="400" fill="#9198a1" text-anchor="start">live access link</text><path d="M207.6 734 H241.6" fill="none" stroke="#8f94fb" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><text x="251.6" y="739" font-size="13" font-weight="400" fill="#9198a1" text-anchor="start">one-way telemetry</text><path d="M382.29999999999995 734 H416.29999999999995" fill="none" stroke="#3fb98a" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><text x="426.29999999999995" y="739" font-size="13" font-weight="400" fill="#9198a1" text-anchor="start">physical output</text><text x="1160" y="739" font-size="12.5" font-weight="400" fill="#9198a1" text-anchor="end">Operator access and releases go over a private Tailscale network.</text></svg>
